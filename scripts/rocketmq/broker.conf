# RocketMQ Broker 配置文件
# 说明：本文件挂载到 docker 容器 /tmp/broker.conf，供 mqbroker 命令读取

brokerClusterName = DefaultCluster
brokerName = diancan-broker
brokerId = 0

# 关键：namesrvAddr 指向 docker compose 内的 namesrv 服务名
namesrvAddr = rocketmq-namesrv:9876

# 容器内监听地址（容器外部访问需要 brokerIP1 或者 docker 端口映射）
listenWhich = 0
brokerIP1 = rocketmq-broker

# 队列与 flush 配置（学习用足够）
defaultTopicQueueNums = 4
autoCreateTopicEnable = true
autoCreateSubscriptionGroup = true

# 存储路径（容器内）
storePathRootDir = /root/store
storePathCommitLog = /root/store/commitlog
storePathConsumeQueue = /root/store/consumequeue
storePathIndex = /root/store/index
storeCheckpoint = /root/store/checkpoint
abortFile = /root/store/abort

# 端口
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH

# HA（高可用）配置——学习用关闭
haListenPort = 10912
transientStorePoolSize = 0